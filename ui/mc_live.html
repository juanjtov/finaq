<!doctype html>
<!--
  FINAQ Mission Control — the live / replay component (Mission Control v2, Phase 2).

  One file, vanilla JS, no CDN. Streamlit embeds it through st.components.v1.html
  (ui/pages/mission_control.py::live_html) after substituting every double-brace placeholder:
  palette + fonts from ui/components.py::mc_tokens(), {{theme}} (day | night),
  {{mode}} (live | replay) and {{snapshot_json}} — the dict data.state.live_snapshot()
  returns (or a run_snapshot() wrapped in the same shape for replay). The page only
  renders that document; elapsed counters and progress rings tick client-side from
  the row timestamps, offset by the snapshot's `now`. Layout: mockup C (control
  room) with mockup B's waterfall underneath and one inspector drawer for both.
-->
<html lang="en" data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINAQ Mission Control</title>
<style>
:root {
  --bg: {{bg}}; --surface: {{surface}}; --surface2: {{surface2}}; --line: {{line}}; --line2: {{line2}};
  --ink: {{ink}}; --ink2: {{ink2}}; --ink3: {{ink3}}; --accent: {{accent}}; --accent-soft: {{accent_soft}};
  --good: {{accent}}; --warn: {{warn}}; --warn-bg: {{warn_bg}}; --crit: {{crit}}; --crit-bg: {{crit_bg}};
  --glow: {{glow}}; --font-ui: {{font_ui}}; --font-mono: {{font_mono}};
  color-scheme: light;
}
:root[data-theme="night"] {
  --bg: {{night_bg}}; --surface: {{night_surface}}; --surface2: {{night_surface2}}; --line: {{night_line}}; --line2: {{night_line2}};
  --ink: {{night_ink}}; --ink2: {{night_ink2}}; --ink3: {{night_ink3}}; --accent: {{night_accent}}; --accent-soft: {{night_accent_soft}};
  --good: {{night_accent}}; --warn: {{night_warn}}; --warn-bg: {{night_warn_bg}}; --crit: {{night_crit}}; --crit-bg: {{night_crit_bg}};
  --glow: {{night_glow}};
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
.mono, pre, .num { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink3); }
.sub { color: var(--ink2); }
.mc { min-width: 900px; padding: 4px 2px 10px; }
.mc h5 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg .n:focus-visible { outline: none; }
svg .n:focus-visible .n-tile { stroke: var(--ink); stroke-width: 2.5; }

/* status forms (never colour alone) */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--ink2); background: var(--surface2); white-space: nowrap; }
.pill.running { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.pill.done { color: var(--good); }
.pill.degraded { color: var(--warn); background: var(--warn-bg); }
.pill.failed { color: #fff; background: var(--crit); border-color: var(--crit); }
.pill.pending { border-style: dashed; color: var(--ink3); background: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink3); flex: 0 0 auto; }
.dot.running { background: var(--accent); box-shadow: 0 0 0 0 var(--glow); animation: pulse 1.4s ease-out infinite; }
.dot.done { background: var(--good); }
.dot.degraded { background: var(--warn); }
.dot.failed { background: var(--crit); }
.dot.pending { background: transparent; border: 1.5px dashed var(--ink3); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--glow); } 100% { box-shadow: 0 0 0 10px transparent; } }
.g { display: inline-block; vertical-align: middle; }
.tile { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); flex: 0 0 auto; }
.tile.warn { background: var(--warn-bg); color: var(--warn); }
.tile.crit { background: var(--crit-bg); color: var(--crit); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv .k { color: var(--ink3); }
.kv .v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; word-break: break-all; }
.ghostbtn { font: 600 11.5px var(--font-ui); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.ghostbtn:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface2); }
.seg button { font: 600 11.5px var(--font-ui); color: var(--ink2); background: transparent; border: 0; padding: 4px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.skel { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--line2), var(--accent-soft), var(--line2)); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; margin: 8px 0; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* vitals */
.topbar { display: flex; align-items: center; gap: 10px; padding: 2px 4px 6px; font-size: 11.5px; color: var(--ink3); }
.topbar .spacer { flex: 1; }
.c-vitals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 0 2px; }
.vital { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.vital .v { font-size: 22px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vital .v.over { color: var(--warn); }
.vital .k { font-size: 11px; color: var(--ink3); margin-top: 2px; }
.vital .t { font-size: 11px; color: var(--ink2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* CIO ribbon */
.ribbon { display: flex; align-items: center; gap: 0; margin: 10px 2px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; overflow: hidden; }
.ribbon .rhead { flex: 0 0 auto; padding-right: 12px; margin-right: 6px; border-right: 1px solid var(--line2); min-width: 150px; }
.ribbon .rhead .nm { font-weight: 800; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.ribbon .rhead .mt { font-size: 10.5px; color: var(--ink3); margin-top: 2px; }
.ribbon.empty { color: var(--ink3); font-size: 12px; }
.rstep { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 3px 8px 3px 2px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.rstep:hover { background: var(--surface2); }
.rstep[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rstep .tile { width: 28px; height: 28px; border-radius: 8px; }
.rstep .nm { font-weight: 700; font-size: 12px; white-space: nowrap; }
.rstep .nm .m { font-weight: 500; font-size: 10.5px; color: var(--ink3); margin-left: 4px; }
.rstep .mt { font-size: 10.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rstep.running .nm { color: var(--accent); }
.rstep.running .tile { box-shadow: 0 0 0 4px var(--glow); }
.rstep.pending .nm { color: var(--ink3); }
.rstep.pending .tile { background: transparent; border: 1.5px dashed var(--line); color: var(--ink3); }
.rstep.failed .tile { background: var(--crit-bg); color: var(--crit); }
.rstep + .rstep::before { content: ""; width: 14px; height: 1px; background: var(--line); margin-right: 6px; flex: 0 0 auto; }
.rstep.done + .rstep::before, .rstep.failed + .rstep::before { background: var(--accent); }

/* transport (replay) */
.transport { display: flex; align-items: center; gap: 10px; margin: 10px 2px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.transport .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
.transport input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.transport .clock { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn { font: 600 12px var(--font-ui); color: var(--ink); background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

/* body */
.c-body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 10px 2px 0; align-items: start; }
.c-main { display: grid; gap: 10px; align-content: start; min-width: 0; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; position: relative; overflow: hidden; }
.canvas svg { width: 100%; height: auto; display: block; }
.run-head { position: absolute; left: 12px; top: 10px; display: flex; gap: 8px; align-items: center; font-size: 12px; background: var(--surface); padding: 4px 6px; border-radius: 8px; max-width: calc(100% - 24px); overflow: hidden; }
.run-head .tk { font-weight: 800; font-size: 14px; }
.run-head .m { color: var(--ink3); font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
.canvas .idle { position: absolute; left: 14px; bottom: 10px; font-size: 11.5px; color: var(--ink3); }
.canvas .follow { position: absolute; right: 12px; top: 12px; }
.n-tile { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.n.pending .n-tile { fill: transparent; stroke: var(--ink3); stroke-dasharray: 4 4; }
.n.degraded .n-tile { fill: var(--warn-bg); stroke: var(--warn); }
.n.failed .n-tile { fill: var(--crit-bg); stroke: var(--crit); }
.n.running .n-tile { filter: drop-shadow(0 0 8px var(--glow)); }
.n .n-g { color: var(--accent); }
.n.pending .n-g { color: var(--ink3); }
.n.degraded .n-g { color: var(--warn); }
.n.failed .n-g { color: var(--crit); }
.n-ring { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; opacity: 0; transition: opacity .3s; }
.n.running .n-ring { opacity: 1; }
.n-ring.over { stroke: var(--warn); }
.n-track { fill: none; stroke: var(--line2); stroke-width: 3; opacity: 0; }
.n.running .n-track { opacity: 1; }
.n-name { font: 700 12.5px var(--font-ui); fill: var(--ink); }
.n-sub { font: 500 10.5px var(--font-ui); fill: var(--ink3); }
.n-st { font: 500 10.5px var(--font-mono); fill: var(--ink2); }
.n.pending .n-name { fill: var(--ink3); }
.n-badge { fill: var(--surface); stroke: var(--good); stroke-width: 1.5; opacity: 0; }
.n-badge-mark { stroke: var(--good); stroke-width: 1.8; fill: none; opacity: 0; stroke-linecap: round; stroke-linejoin: round; }
.n.done .n-badge, .n.done .n-badge-mark, .n.degraded .n-badge, .n.degraded .n-badge-mark, .n.failed .n-badge, .n.failed .n-badge-mark { opacity: 1; }
.n.degraded .n-badge, .n.degraded .n-badge-mark { stroke: var(--warn); }
.n.failed .n-badge, .n.failed .n-badge-mark { stroke: var(--crit); }
.n.sel .n-tile { stroke-width: 2.5; stroke: var(--ink); }
.n { cursor: pointer; }
.e { fill: none; stroke: var(--line); stroke-width: 1.5; transition: stroke .4s; }
.e.flowing { stroke: var(--accent); stroke-dasharray: 5 7; animation: flow 1.1s linear infinite; }
.e.done { stroke: var(--accent); }
@keyframes flow { to { stroke-dashoffset: -24; } }
.e-pill { fill: var(--surface); stroke: var(--line); }
.e.flowing + .e-lab .e-pill, .e.done + .e-lab .e-pill { stroke: var(--accent); }
.e-txt { font: 500 10px var(--font-mono); fill: var(--ink2); text-anchor: middle; }

/* waterfall (mockup B) */
.wf { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
.wf-axis { display: grid; grid-template-columns: 190px 1fr; border-bottom: 1px solid var(--line2); font-family: var(--font-mono); font-size: 10px; color: var(--ink3); }
.wf-axis .lab { padding: 0 10px; line-height: 22px; font-family: var(--font-ui); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.wf-axis .plot { position: relative; height: 22px; }
.wf-axis .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line2); padding-left: 4px; line-height: 22px; white-space: nowrap; }
.wf-rows { position: relative; }
.wf-row { display: grid; grid-template-columns: 190px 1fr; align-items: center; height: 24px; cursor: pointer; border-bottom: 1px solid var(--line2); }
.wf-row:hover { background: var(--surface2); }
.wf-row[aria-selected="true"] { background: var(--accent-soft); }
.wf-row .lab { display: flex; align-items: center; gap: 7px; font-size: 11.5px; padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink2); }
.wf-row .lab b { color: var(--ink); font-weight: 700; }
.wf-row[data-depth="1"] .lab { padding-left: 24px; }
.wf-row[data-depth="2"] .lab { padding-left: 42px; font-size: 11px; }
.wf-row .plot { position: relative; height: 100%; }
.sp { position: absolute; top: 6px; height: 12px; border-radius: 3px; background: var(--accent); opacity: .85; min-width: 2px; }
.sp.llm { top: 9px; height: 6px; background: var(--ink); opacity: .9; }
.sp.ghost { background: transparent; border: 1px dashed var(--ink3); opacity: .6; top: 5px; height: 14px; }
.sp.degraded { background: var(--warn); }
.sp.failed { background: var(--crit); }
.sp.running { border-radius: 3px 0 0 3px; }
.sp.running::after { content: ""; position: absolute; right: -1px; top: -3px; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 0 0 var(--glow); animation: pulse 1.2s ease-out infinite; }
.sp-lab { position: absolute; top: 4px; font-family: var(--font-mono); font-size: 10px; color: var(--ink2); white-space: nowrap; padding-left: 6px; }
.sp-lab.over { color: var(--warn); }
.playhead { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--crit); pointer-events: none; z-index: 3; }
.playhead::before { content: ""; position: absolute; top: -1px; left: -6px; border: 5px solid transparent; border-top: 7px solid var(--crit); }
.wf-overlay { position: absolute; left: 190px; right: 0; top: 0; bottom: 0; pointer-events: none; }
.wf .empty { padding: 10px 12px; font-size: 12px; color: var(--ink3); }

/* fleet */
.fleet { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 10px; align-items: start; }
.panel .kv .v { word-break: normal; white-space: nowrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-width: 0; }
.runrow { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
.runrow:hover { background: var(--surface2); }
.runrow[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.runrow .tk { font-weight: 800; min-width: 40px; }
.runrow .th { color: var(--ink3); font-size: 11.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runrow .st { font-family: var(--font-mono); font-size: 11px; color: var(--ink2); white-space: nowrap; }
.panel .none { font-size: 12px; color: var(--ink3); padding: 2px 0; }

/* inspector drawer (shared) */
.c-drawer { min-height: 560px; height: 100%; position: sticky; top: 0; }
.insp { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 560px; max-height: 940px; overflow: hidden; }
.insp-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line2); display: flex; gap: 10px; align-items: center; min-width: 0; }
.insp-head .ttl { font-weight: 800; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.insp-head .ctx { font-size: 11.5px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.insp-head > div { min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line2); }
.tab { font: 600 12px var(--font-ui); color: var(--ink2); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px 8px; cursor: pointer; border-radius: 6px 6px 0 0; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.insp-body { padding: 10px 12px 12px; overflow: auto; flex: 1; min-height: 0; }
.insp-body pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11.5px; line-height: 1.5; color: var(--ink); background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; }
.insp-body pre .dim { color: var(--ink3); }
.insp-body pre.err { color: var(--crit); border-color: var(--crit); }
.meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--ink3); margin-bottom: 8px; }
.meta-row .mono { color: var(--ink2); }
.meta-row .spacer { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.tiles > div { background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.tiles .v { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiles .k { font-size: 10.5px; color: var(--ink3); }
.tiles .d { font-size: 10.5px; color: var(--ink2); margin-top: 2px; }
.tiles .d.over { color: var(--warn); }
.callpick { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.callpick button { font: 600 10.5px var(--font-mono); border: 1px solid var(--line); background: var(--surface2); color: var(--ink2); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.callpick button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.act { border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--surface2); font-size: 12px; }
.act .h { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.act .r { color: var(--ink2); margin-top: 4px; font-size: 11.5px; }
.act .m { color: var(--ink3); margin-top: 3px; font-family: var(--font-mono); font-size: 10.5px; }
.spanrow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line2); font-size: 12px; }
.spanrow .l { display: flex; gap: 7px; align-items: center; min-width: 0; }
.spanrow .l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spanrow .d { font-family: var(--font-mono); font-size: 11px; color: var(--ink2); }
.spanrow .meta { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink3); white-space: pre-wrap; word-break: break-word; }

@media (prefers-reduced-motion: reduce) {
  .dot.running, .sp.running::after, .e.flowing, .skel, .rstep.running .tile { animation: none !important; }
  .n-ring, .e, .bar > i { transition: none !important; }
}
</style>
</head>
<body>
<div class="mc" id="mc" data-mode="{{mode}}">
  <div class="topbar" id="c-topbar"></div>
  <div class="c-vitals" id="c-vitals"></div>
  <div class="ribbon" id="c-ribbon"></div>
  <div class="transport" id="c-transport" hidden></div>
  <div class="c-body">
    <div class="c-main">
      <div class="canvas" id="c-canvas"></div>
      <div class="wf" id="c-wf"></div>
      <aside class="fleet" id="c-fleet"></aside>
    </div>
    <aside class="c-drawer"><div class="insp" id="c-insp"></div></aside>
  </div>
</div>
<script id="mc-data" type="application/json">{{snapshot_json}}</script>
<script>
(function () {
'use strict';
// ------------------------------------------------------------------ data
const DATA = JSON.parse(document.getElementById('mc-data').textContent || '{}');
const MODE = DATA.mode === 'replay' ? 'replay' : 'live';
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const MEDIANS = DATA.medians || {};
const GLYPHS = {
  json: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 8c-1.6 0-2 .6-2 2v1.2c0 .9-.5 1.3-1.3 1.3.8 0 1.3.4 1.3 1.3V15c0 1.4.4 2 2 2"/><path d="M14.5 8c1.6 0 2 .6 2 2v1.2c0 .9.5 1.3 1.3 1.3-.8 0-1.3.4-1.3 1.3V15c0 1.4-.4 2-2 2"/>',
  chart: '<path d="M6 20v-7M12 20V6M18 20v-10M3 20h18"/>',
  contract: '<path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8 12h6"/><circle cx="14.5" cy="17" r="2.6"/>',

      body = ss.spans.length ? ss.spans.map(sp => { const st = spanState(sp, t); const a = ts(sp.started_at), b = ts(sp.ended_at); const d = st === 'running' ? Math.max(0, (t - a) / 1000) : (a !== null && b !== null ? (b - a) / 1000 : null); const meta = Object.keys(sp.meta || {}).length ? JSON.stringify(sp.meta) : ''; return '<div class="spanrow"><div class="l"><span class="dot ' + st + '"></span><span><b>' + esc(sp.label || step.name.toLowerCase()) + '</b></span></div><span class="d">' + (d == null ? '—' : fmtDur(d)) + '</span>' + pill(st) + (meta || sp.error ? '<div class="meta">' + esc(meta) + (sp.error ? '\nerror: ' + esc(sp.error) : '') + '</div>' : '') + '</div>'; }).join('') : '<pre><span class="dim">No span recorded for this step yet.</span></pre>';
    } else if (sel === 'Decisions') {
      body = actions.map(a => '<div class="act"><div class="h"><span class="tk">' + esc(a.ticker) + '</span><span class="muted">× ' + esc(a.thesis || '—') + '</span>' + pill(a.action === 'drill' ? 'running' : a.action === 'reuse' ? 'done' : 'pending').replace(/>(running|done|pending)</, '>' + esc(String(a.action || '?')) + '<') + '<span class="muted" style="font-weight:500">confidence ' + esc(a.confidence || '—') + '</span></div><div class="r">' + esc(a.rationale || '') + '</div><div class="m">' + esc(a.model_used || '—') + ' · ' + fmtTok(a.tokens_in) + ' / ' + fmtTok(a.tokens_out) + ' tok · ' + fmtUsd(a.cost_usd) + ' · ' + fmtDur(Number(a.latency_s || 0)) + (a.source ? ' · ' + esc(a.source) : '') + (a.drill_run_id ? ' · run ' + esc(short(a.drill_run_id)) : a.reuse_run_id ? ' · reuse ' + esc(short(a.reuse_run_id)) : '') + '</div></div>').join('');
    } else {
      body = '<pre>' + esc(cyc.summary) + '</pre>';
    }
  } else if (run && S.node && NODE_BY[S.node]) {
    const n = NODE_BY[S.node], ns = nodeState(run, n.id, t);
    const rs = runState(run, t);
    const st = rs === 'pending' ? 'pending' : ns.st;
    const isLLM = !!n.env;
    tabs = isLLM ? ['System prompt', 'User prompt', 'Output', 'Telemetry'] : ['Telemetry'];
    const def = isLLM ? (ns.callSt === 'done' || ns.callSt === 'failed' || st === 'degraded' ? 'Output' : 'User prompt') : 'Telemetry';
    sel = pickTab(tabs, def);
    const call = ns.call;
    head = '<span class="tile' + (st === 'degraded' ? ' warn' : st === 'failed' ? ' crit' : '') + '">' + glyph(n.glyph, 18) + '</span><div><div class="ttl">' + esc(n.name) + ' <span class="muted" style="font-weight:500">· ' + esc(run.ticker) + ' × ' + esc(run.thesis) + '</span></div><div class="ctx mono">run ' + esc(short(run.run_id)) + ' · ' + esc(run.source || 'manual') + (n.env ? ' · ' + n.env + (call && call.model ? ' → ' + esc(call.model) : '') : ' · no LLM') + '</div></div><span style="flex:1"></span>' + pill(st);
    const pickRow = ns.calls.length > 1 ? '<div class="callpick">' + ns.calls.map((c, i) => '<button type="button" data-call="' + i + '" aria-pressed="' + (i === ns.callIdx) + '">call ' + (i + 1) + '</button>').join('') + '</div>' : '';
    const msgs = call ? (call.messages || []) : [];
    const sysMsgs = msgs.filter(m => m.role === 'system'), userMsgs = msgs.filter(m => m.role !== 'system');
    const copyBtn = s => '<span class="spacer"></span><button class="ghostbtn" type="button" data-copy>copy</button>';
    if (sel === 'System prompt') {
      if (!call) body = '<pre><span class="dim">' + (st === 'pending' ? 'The system prompt appears here the moment the call starts, before the model answers.' : run.thin ? 'Prompts are kept for active runs and replay — open this run in the Runs tab.' : 'No LLM call recorded for this node' + (st === 'degraded' ? ' — it returned before calling the model (soft error).' : '.')) + '</span></pre>';
      else if (!sysMsgs.length) body = '<pre><span class="dim">' + (call.prompt_excerpt ? 'Full messages were not stored for this call (pre-v9 run); excerpt:\n\n' + esc(call.prompt_excerpt) : 'No system message on this call.') + '</span></pre>';
      else { const text = sysMsgs.map(m => m.text).join('\n\n'); body = '<div class="meta-row">stored once per content hash · <span class="mono">' + text.length.toLocaleString() + ' chars</span> · llm_calls.id <span class="mono">' + esc(call.id) + '</span>' + copyBtn() + '</div><pre data-text>' + esc(text) + '</pre>'; }
    } else if (sel === 'User prompt') {
      if (!call) body = '<pre><span class="dim">' + (st === 'pending' ? 'The user prompt appears here the moment the call starts, before the model answers.' : run.thin ? 'Prompts are kept for active runs and replay — open this run in the Runs tab.' : 'No LLM call recorded for this node.') + '</span></pre>';
      else if (!userMsgs.length) body = '<pre><span class="dim">' + (call.prompt_excerpt ? 'Full messages were not stored for this call (pre-v9 run); excerpt:\n\n' + esc(call.prompt_excerpt) : 'No user message on this call.') + '</span></pre>';
      else { const text = userMsgs.map(m => (userMsgs.length > 1 ? '[' + m.role + ']\n' : '') + m.text).join('\n\n'); body = '<div class="meta-row">built by agents/' + n.id + '.py · <span class="mono">' + text.length.toLocaleString() + ' chars</span>' + (ns.callSt === 'done' ? ' · tokens in <span class="mono">' + Number(call.tokens_in || 0).toLocaleString() + '</span>' : '') + copyBtn() + '</div><pre data-text>' + esc(text) + '</pre>'; }
    } else if (sel === 'Output') {
      if (st === 'pending') body = '<pre><span class="dim">Not started.</span></pre>';
      else if (!call) body = '<pre><span class="dim">' + (st === 'running' ? 'Running · no LLM call yet (' + (n.id === 'fundamentals' ? 'fetching yfinance' : n.id === 'filings' ? 'retrieving the three subqueries' : n.id === 'news' ? 'fetching Finnhub articles' : 'working') + ') · ' + fmtDur(ns.elapsed) : st === 'degraded' ? 'Returned before calling the model: ' + esc((ns.soft || {}).message || 'soft error') : st === 'failed' ? 'Failed: ' + esc(ns.row.error || '') : run.thin ? 'Outputs are kept for active runs and replay — open this run in the Runs tab.' : 'No LLM call recorded for this node.') + '</span></pre>';
      else if (ns.callSt === 'running') body = '<div class="meta-row">waiting for ' + esc(call.model || 'the model') + ' · ' + fmtDur(ns.callElapsed) + ' · attempt ' + esc(call.attempt || 1) + '</div><div class="skel" style="width:92%"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:84%"></div>';
      else if (ns.callSt === 'failed') body = '<div class="meta-row">call failed after ' + fmtDur(ns.callElapsed) + '</div><pre class="err">' + esc(call.error || 'unknown error') + '</pre>';
      else body = '<div class="meta-row">tokens out <span class="mono">' + Number(call.tokens_out || 0).toLocaleString() + '</span> · ' + fmtDur(ns.callElapsed) + ' · written to state.' + n.id + (st === 'degraded' ? ' · <span style="color:var(--warn)">soft error recorded in errors</span>' : '') + copyBtn() + '</div><pre data-text>' + (call.response != null ? esc(call.response) : '<span class="dim">' + (call.response_excerpt ? 'Full response not stored for this call (pre-v9 run); excerpt:\n\n' + esc(call.response_excerpt) : 'No response text stored.') + '</span>') + '</pre>';
    } else {
      const med = MEDIANS[n.id] || 0;
      const cur = st === 'pending' ? 0 : st === 'running' ? ns.elapsed : ns.dur;
      const over = med > 1 && cur > med;
      let etaTxt = '';
      if (st === 'running' && med > 1) etaTxt = over ? '+' + Math.round((cur / med - 1) * 100) + '% over the median' : '≈ ' + fmtDur(med - cur) + ' left · median ' + fmtDur(med);
      else if (med > 1) etaTxt = 'median ' + fmtDur(med) + (st !== 'pending' && over ? ' · +' + Math.round((cur / med - 1) * 100) + '%' : '');
      else etaTxt = med ? 'sub-second' : 'no median yet';
      const done = ns.callSt === 'done';
      const row = ns.row || {};  // a thin run may show a node that never wrote a row
      const nCalls = run.thin ? (row.n_calls || 0) : ns.calls.length;
      body = '<div class="tiles">' +
        '<div><div class="v num">' + (st === 'pending' ? '—' : fmtDur(cur)) + '</div><div class="k">' + (st === 'running' ? 'elapsed' : 'duration') + '</div><div class="d' + (over ? ' over' : '') + '">' + esc(etaTxt) + '</div></div>' +
        '<div><div class="v num">' + (done ? fmtTok(call.tokens_in) + ' / ' + fmtTok(call.tokens_out) : (run.thin && row.tokens_in != null ? fmtTok(row.tokens_in) + ' / ' + fmtTok(row.tokens_out) : '—')) + '</div><div class="k">tokens in / out</div><div class="d">' + (n.env ? n.env : 'no LLM') + '</div></div>' +
        '<div><div class="v num">' + (done ? fmtUsd(call.cost_usd) : ns.callSt === 'running' ? '…' : (ns.row && ns.row.cost_usd ? fmtUsd(ns.row.cost_usd) : '$0')) + '</div><div class="k">cost</div><div class="d">' + (call ? 'OpenRouter usage × price table' : '') + '</div></div>' +
        '<div><div class="v num">' + (ns.callSt === 'running' ? nCalls + ' ↻' : String(nCalls)) + '</div><div class="k">LLM calls</div><div class="d">' + (call ? 'attempt ' + esc(call.attempt || 1) : '') + '</div></div></div>' +
        '<div class="kv"><span class="k">node_runs.id</span><span class="v">' + esc(ns.row && ns.row.id != null ? ns.row.id : '—') + '</span><span class="k">llm_calls.id</span><span class="v">' + esc(call ? call.id : '—') + '</span><span class="k">model</span><span class="v">' + esc(call && call.model ? call.model : '—') + '</span><span class="k">started</span><span class="v">' + (ns.s !== null ? fmtClock(ns.s) : '—') + '</span><span class="k">pid</span><span class="v">' + esc(ns.row && ns.row.pid != null ? ns.row.pid : '—') + '</span></div>' +
        (ns.row && ns.row.error ? '<pre class="err" style="margin-top:8px">' + esc(ns.row.error) + '</pre>' : '') +
        (ns.soft ? '<pre style="margin-top:8px"><span class="dim">soft error · </span>' + esc(ns.soft.message) + '</pre>' : '');
    }
    body = pickRow + body;
  } else if (run) {
    const rs = runState(run, t);
    tabs = ['Summary']; sel = 'Summary';
    head = '<span class="tile">' + glyph('graph', 18) + '</span><div><div class="ttl">' + esc(run.ticker) + ' × ' + esc(run.thesis) + '</div><div class="ctx mono">run ' + esc(short(run.run_id)) + ' · ' + esc(run.source || 'manual') + '</div></div><span style="flex:1"></span>' + pill(rs);
    const lines = NODES.map(n => { const ns = nodeState(run, n.id, t); return n.name.padEnd(13) + ' ' + ns.st.padEnd(9) + (ns.st === 'pending' || run.thin ? '' : fmtDur(ns.st === 'running' ? ns.elapsed : ns.dur)); }).join('\n');
    body = '<div class="tiles"><div><div class="v num">' + fmtDur(runElapsed(run, t)) + '</div><div class="k">' + (rs === 'running' ? 'elapsed' : 'duration') + '</div><div class="d">' + (MEDIANS.run ? 'median ' + fmtDur(MEDIANS.run) : '') + '</div></div><div><div class="v num">' + fmtUsd(runCost(run, t)) + '</div><div class="k">cost</div></div><div><div class="v num">' + fmtTok(runTokens(run, t)) + '</div><div class="k">tokens</div></div><div><div class="v num">' + esc(run.confidence || '—') + '</div><div class="k">confidence</div></div></div><pre>' + esc(lines) + '</pre>' + (run.error ? '<pre class="err" style="margin-top:8px">' + esc(run.error) + '</pre>' : '');
  } else {
    head = '<div><div class="ttl">Nothing to inspect yet</div><div class="ctx">Prompts, outputs and telemetry appear here once a drill-in runs.</div></div>';
  }
  const html = '<div class="insp-head">' + head + '</div>' + (tabs.length ? '<div class="tabs" role="tablist">' + tabs.map(tb => '<button class="tab" role="tab" type="button" data-tab="' + tb + '" aria-selected="' + (tb === sel) + '" tabindex="' + (tb === sel ? 0 : -1) + '">' + tb + '</button>').join('') + '</div>' : '') + '<div class="insp-body">' + body + '</div>';
  if (setHTML(el, html)) {
    const b = el.querySelector('.insp-body');
    if (b) { b.scrollTop = S.scroll || 0; b.addEventListener('scroll', () => { S.scroll = b.scrollTop; savePrefs(run); }); }
    const tabEls = Array.from(el.querySelectorAll('.tab'));
    tabEls.forEach((btn, i) => {
      btn.addEventListener('click', () => { S.tabs[key] = btn.dataset.tab; S.scroll = 0; render(true); });
      btn.addEventListener('keydown', e => { let j = null; if (e.key === 'ArrowRight') j = (i + 1) % tabEls.length; else if (e.key === 'ArrowLeft') j = (i - 1 + tabEls.length) % tabEls.length; else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = tabEls.length - 1; if (j !== null) { e.preventDefault(); S.tabs[key] = tabEls[j].dataset.tab; S.scroll = 0; render(true); const nb = el.querySelector('.tab[aria-selected="true"]'); if (nb) nb.focus(); } });
    });
    el.querySelectorAll('[data-call]').forEach(btn => btn.addEventListener('click', () => { S.call[S.node] = Number(btn.dataset.call); render(true); }));
    el.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', () => { const pre = el.querySelector('pre[data-text]'); if (pre) { copyText(pre.textContent); btn.textContent = 'copied'; setTimeout(() => { btn.textContent = 'copy'; }, 1200); } }));
  }
}

// ------------------------------------------------------------------ render loop
let lastRender = 0, lastFrame = null, inited = false, prevRunId = null;
function render(force) {
  const run = pickRun();
  if (run && run.run_id !== prevRunId) { prevRunId = run.run_id; restorePrefs(run); if (MODE === 'replay') initTransport(run); }
  const t = MODE === 'replay' ? S.t : liveNow();
  if (run && (S.auto || !S.node || !NODE_BY[S.node]) && !S.step) S.node = liveLlmNode(run, t);
  try { renderTopbar(run, t); } catch (err) { console.error('topbar', err); }
  try { renderVitals(run, t); } catch (err) { console.error('vitals', err); }
  try { renderRibbon(t); } catch (err) { console.error('ribbon', err); }
  try { updateCanvas(run, t); } catch (err) { console.error('canvas', err); }
  try { renderWaterfall(run, t); } catch (err) { console.error('waterfall', err); }
  try { renderFleet(run, t); } catch (err) { console.error('fleet', err); }
  try { updateTransport(run); } catch (err) { console.error('transport', err); }
  try { inspector(run, t); } catch (err) { console.error('inspector', err); }
  if (force) savePrefs(run);
}
function frame(now) {
  if (lastFrame === null) lastFrame = now;
  const dt = (now - lastFrame) / 1000; lastFrame = now;
  if (MODE === 'replay' && S.playing) {
    const run = pickRun();
    if (run) { const end = replayEnd(run); S.t = Math.min(end, S.t + dt * S.speed * 1000); if (S.t >= end) { S.playing = false; const b = document.getElementById('tp-play'); if (b) { b.textContent = '▶ Play'; b.setAttribute('aria-label', 'Play'); } savePrefs(run); } }
  }
  if (now - lastRender > (REDUCED ? 500 : 140)) { lastRender = now; render(false); }
  requestAnimationFrame(frame);
}
try { const m = localStorage.getItem('mc-theme'); if (m === 'night' || m === 'day') document.documentElement.setAttribute('data-theme', m); } catch (e) {}
if (MODE === 'live') { const r = load('mc:live:run'); if (r && (activeRuns().some(x => x.run_id === r) || (DATA.recent || []).some(x => x.run_id === r))) S.runId = r; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { S.auto = true; S.step = null; render(true); } });
initCanvas();
render(true);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
